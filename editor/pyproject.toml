[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treesite-editor"
version = "0.1.0"
description = "Python SDK and LangGraph orchestration for TreeSite content artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "pydantic>=2",
  "pydantic-settings>=2",
  "structlog>=24",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "mcp>=1.6",
  "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.24"]
llm = ["langchain-anthropic>=0.3", "langchain-mcp-adapters>=0.1"]

[tool.hatch.build.targets.wheel]
packages = ["treesite_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
