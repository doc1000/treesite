[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treesite-editor"
version = "0.1.0"
description = "Python SDK and LangGraph orchestration for TreeSite content artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "pydantic>=2",
  "pydantic-settings>=2",
  "structlog>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["treesite_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
